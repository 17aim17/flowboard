# The live demo runs on Render's free plan, where a service sleeps after 15 idle minutes. A sleeping API
# makes the web app wait (or fail) on its first calls, so this pings the API every 10 minutes
# (one small request, under the 15-minute limit).
# Only the API: both services awake all month would use about 1,490 hours, over the plan's 750.
# The web app can sleep; Render wakes it on the next browser visit with its own loading page.
name: Keep demo API awake

on:
  schedule:
    # Off the top of the hour, when GitHub's scheduler is busiest and runs start late.
    - cron: '3-59/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the API
        run: curl -fsS --max-time 120 --retry 3 --retry-delay 10 https://flowboard-api-22sn.onrender.com/health
