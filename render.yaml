# Render Blueprint: the same images as docker-compose.yml, on Render's free plan.
# Render dashboard: New > Blueprint > pick this repo. See README "Deploy (Render)".
services:
  - type: web
    name: flowboard-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    # The free plan has no pre-deploy step, so migrations and the seed (only on an empty database) run on start.
    dockerCommand: sh src/db/start.sh
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: flowboard-db, property: connectionString }

  - type: web
    name: flowboard-web
    runtime: docker
    plan: free
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    envVars:
      # The API's public URL (Render added the suffix). Change it if the API gets a new URL.
      - key: API_UPSTREAM
        value: https://flowboard-api-22sn.onrender.com
      - key: PORT
        value: '80'

databases:
  - name: flowboard-db
    plan: free
    databaseName: flowboard
    user: flowboard
    # The schema uses uuidv7(), new in Postgres 18.
    postgresMajorVersion: '18'
