# A template: the nginx image fills in ${API_UPSTREAM} at start (http://api:3000 in Docker Compose,
# the API's public https URL on Render).
server {
  listen 80;
  root /usr/share/nginx/html;

  # Needed when the API is behind https on a shared host. A free Render API can take about a minute
  # to wake up, hence the longer read timeout.
  proxy_ssl_server_name on;
  proxy_read_timeout 120s;

  # API and its docs. nginx's request id becomes the API's request id, so one id follows a request through both logs.
  location /v1/ {
    proxy_pass ${API_UPSTREAM};
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /docs {
    proxy_pass ${API_UPSTREAM};
  }

  # Hashed build assets never change, so browsers can cache them for good.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Single-page app: every other path is a client route.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
