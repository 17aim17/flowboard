server {
  listen 80;
  root /usr/share/nginx/html;

  # API and its docs. nginx's request id becomes the API's request id, so one id follows a request through both logs.
  location /v1/ {
    proxy_pass http://api:3000;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /docs {
    proxy_pass http://api:3000;
  }

  # Hashed build assets never change, so browsers can cache them for good.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Single-page app: every other path is a client route.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
